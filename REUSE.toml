version = 1
SPDX-PackageName = "slang"
SPDX-PackageSupplier = "Michael Popoloski <mike@popoloski.com>"
SPDX-PackageDownloadLocation = "https://sv-lang.com/"

[[annotations]]
path = [
    "docs/**.dox",
    "docs/grammar.md",
    "docs/index.html",
    "docs/Doxyfile.in",
    "examples/**/README.md",
    "external/ieee1800/*.h",
    "pyslang/docs/pages/index.rst",
    "pyslang/examples/README.md",
    "pyslang/tests/some_file.svh",
    "scripts/**",
    "tests/unittests/data/**",
    "tests/regression/**",
    "tests/benchmarks/slang_args.yaml",
    "tools/**/README.md",
    ".github/**",
    ".vscode/**",
    ".clang-format",
    ".clang-tidy",
    ".editorconfig",
    ".flake8",
    ".git_archival.txt",
    ".gitattributes",
    ".gitignore",
    ".lcovrc",
    ".pre-commit-config.yaml",
    "CHANGELOG.md",
    "codecov.yml",
    "CMakePresets.json",
    "CODE_OF_CONDUCT.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "README.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Michael Popoloski"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["external/boost_unordered.hpp", "external/boost_concurrent.hpp"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Boost authors"
SPDX-License-Identifier = "BSL-1.0"

[[annotations]]
path = "external/expected.hpp"
precedence = "aggregate"
SPDX-FileCopyrightText = "Martin Moene"
SPDX-License-Identifier = "BSL-1.0"

[[annotations]]
path = "external/BS_thread_pool.hpp"
precedence = "aggregate"
SPDX-FileCopyrightText = "Barak Shoshany"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "docs/cppreference-doxygen-web.tag.xml"
precedence = "aggregate"
SPDX-FileCopyrightText = "cppreference.com"
SPDX-License-Identifier = "CC-BY-SA-3.0"

# SVMake VAMS P0.1: the Verilog-AMS standard definition files of Accellera VAMS-2023 Annex D.
# disciplines.vams is the Annex D.1 text (sha256 54e59ce5...c031); constants.vams is the Annex D.2
# text with one correction (sha256 a97b6e38...aea9): the 2023 PDF prints the `define P_U0 line
# with typographic quotes, replaced by grave accents and marked in the file. Rebuilt from the
# PDF text (pdftotext -layout, cross-checked token by token against -raw); a whitespace-insensitive
# diff against Accellera's published 2.4.0 files shows only the header for disciplines.vams and,
# for constants.vams, the NIST2018 additions plus this correction. See
# tests/unittests/data/vams/README.
[[annotations]]
path = ["tests/unittests/data/vams/disciplines.vams", "tests/unittests/data/vams/constants.vams"]
precedence = "override"
SPDX-FileCopyrightText = "Accellera Systems Initiative Inc."
SPDX-License-Identifier = "LicenseRef-Accellera-VAMS-Annex-D"
